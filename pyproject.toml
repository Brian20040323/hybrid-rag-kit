[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hybrid-rag-kit"
version = "0.2.0"
description = "Independent hybrid RAG: BM25+TF-IDF+RRF, query expansion, MMR, citations, ablation reports. No vector DB."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Brian20040323" }]
keywords = ["rag", "bm25", "tf-idf", "rrf", "hybrid-search", "information-retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.3"]
chinese = ["jieba>=0.42"]

[project.urls]
Repository = "https://github.com/Brian20040323/hybrid-rag-kit"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
